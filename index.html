<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Web Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: #333;
            color: white;
            padding: 15px;
            text-align: center;
        }

        section {
            padding: 20px;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>This is my first HTML page</p>
    </header>

    <section>
        <h2>About Me</h2>
        <p>
            Hello! I am learning web development.
            This page is created using HTML and CSS.
        </p>

        <h2>My Goals</h2>
        <ul>
            <li>Learn HTML</li>
            <li>Learn CSS</li>
            <li>Become a Web Developer</li>
        </ul>
    </section>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

</body>
</html>
